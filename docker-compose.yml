services:
  mysql:
    image: mysql:8
    container_name: safe_mind_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: safemind
      MYSQL_PASSWORD: safemind
      MYSQL_DATABASE: safe_mind
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:

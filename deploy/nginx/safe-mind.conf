# Nginx reverse proxy for the Safe Mind API.
# Install at /etc/nginx/sites-available/safe-mind.conf, symlink into
# sites-enabled, then run `certbot --nginx -d api.safemind.app` to fill in
# the SSL block below.

server {
    listen 80;
    server_name api.safemind.app;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 5m;
}
